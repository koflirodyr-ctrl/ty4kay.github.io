<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ty4kay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-void: #0a0a0a;
    --bg-grid: #131313;
    --panel: #141414;
    --panel-border: #282828;
    --panel-border-hover: #454545;
    --text-primary: #f4f4f4;
    --text-muted: #8c8c8c;
    --text-dim: #4a4a4a;
    --amber: #ffffff;
    --green: #cfcfcf;
    --font-mono: 'JetBrains Mono', monospace;
    --font-body: 'Inter', sans-serif;
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  body{
    min-height: 100vh;
    background: var(--bg-void);
    background-image:
      linear-gradient(var(--bg-grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px);
    background-size: 42px 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    font-family: var(--font-body);
    color: var(--text-primary);
    position: relative;
    overflow-x: hidden;
  }

  body::before{
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at 50% 0%, rgba(255,255,255,0.05), transparent 60%);
    pointer-events: none;
  }

  .panel{
    width: 100%;
    max-width: 480px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 30px 80px -20px rgba(0,0,0,0.6);
    animation: rise 0.6s ease-out;
  }

  @keyframes rise{
    from{ opacity:0; transform: translateY(14px); }
    to{ opacity:1; transform: translateY(0); }
  }

  .titlebar{
    display:flex;
    align-items:center;
    gap:8px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--panel-border);
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-dim);
  }
  .dot{ width:9px; height:9px; border-radius:50%; background: var(--panel-border); }

  .body-pad{ padding: 28px 26px 24px; }

  .prompt{
    font-family: var(--font-mono);
    font-size: 14px;
    color: var(--green);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .cursor{
    display:inline-block;
    width:8px; height:16px;
    background: var(--green);
    animation: blink 1.1s steps(1) infinite;
  }
  @keyframes blink{ 50%{ opacity:0; } }

  h1{
    font-family: var(--font-mono);
    font-size: 26px;
    font-weight: 700;
    margin: 0 0 4px;
    letter-spacing: -0.02em;
  }

  .status{
    display:inline-flex;
    align-items:center;
    gap:7px;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--amber);
    background: rgba(255,180,84,0.08);
    border: 1px solid rgba(255,180,84,0.25);
    padding: 4px 9px;
    border-radius: 20px;
    margin: 10px 0 18px;
  }
  .status .led{
    width:6px; height:6px; border-radius:50%;
    background: var(--amber);
    box-shadow: 0 0 8px var(--amber);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:0.35; } }

  .bio{
    font-size: 14px;
    line-height: 1.55;
    color: var(--text-muted);
    margin-bottom: 26px;
  }

  .ports{
    display:flex;
    flex-direction: column;
    gap: 8px;
  }

  .port{
    display:flex;
    align-items:center;
    gap: 12px;
    padding: 12px 14px;
    border: 1px solid var(--panel-border);
    border-radius: 7px;
    text-decoration:none;
    color: var(--text-primary);
    background: rgba(255,255,255,0.012);
    transition: border-color 0.2s ease, transform 0.15s ease, background 0.2s ease;
    position: relative;
  }
  .port:hover{
    border-color: var(--panel-border-hover);
    background: rgba(110,231,176,0.045);
    transform: translateX(2px);
  }

  .port-idx{
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-dim);
    width: 20px;
  }

  .port-led{
    width:7px; height:7px;
    border-radius:50%;
    background: var(--text-dim);
    flex-shrink:0;
    transition: background 0.2s ease, box-shadow 0.2s ease;
  }
  .port:hover .port-led{
    background: var(--green);
    box-shadow: 0 0 8px var(--green);
  }

  .port-label{
    font-family: var(--font-mono);
    font-size: 13.5px;
    font-weight: 500;
    letter-spacing: 0.03em;
    flex: 1;
  }

  .port-arrow{
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--text-dim);
    transition: transform 0.2s ease, color 0.2s ease;
  }
  .port:hover .port-arrow{
    color: var(--green);
    transform: translateX(3px);
  }

  footer{
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--text-dim);
    text-align: center;
    margin-top: 22px;
    letter-spacing: 0.04em;
  }

  @media (prefers-reduced-motion: reduce){
    .cursor, .status .led, .panel{ animation: none; }
  }
</style>
</head>
<body>

<div class="panel">
  <div class="titlebar">
    <span class="dot"></span><span class="dot"></span><span class="dot"></span>
  </div>
  <div class="body-pad">
    <h1>ty4kay</h1>
    <div class="status"><span class="led"></span>ON AIR WHEN LIVE</div>

    <!-- Отредактируй эту строку под себя -->
    <p class="bio">Собираю интерактивные штуки для стрима и учусь строить сети, которые не падают. Ссылки на все каналы — ниже.</p>

    <div class="ports">
      <!-- Замени href="#" на свои настоящие ссылки -->
      <a class="port" href="https://www.twitch.tv/ty4kay" target="_blank" rel="noopener">
        <span class="port-idx">01</span>
        <span class="port-led"></span>
        <span class="port-label">TWITCH</span>
        <span class="port-arrow">&#8594;</span>
      </a>
      <a class="port" href="https://www.youtube.com/@ty4kayy" target="_blank" rel="noopener">
        <span class="port-idx">02</span>
        <span class="port-led"></span>
        <span class="port-label">YOUTUBE</span>
        <span class="port-arrow">&#8594;</span>
      </a>
      <a class="port" href="https://t.me/ty4katam" target="_blank" rel="noopener">
        <span class="port-idx">03</span>
        <span class="port-led"></span>
        <span class="port-label">TELEGRAM</span>
        <span class="port-arrow">&#8594;</span>
      </a>
      <a class="port" href="https://discord.gg/agV8pbTNt" target="_blank" rel="noopener">
        <span class="port-idx">04</span>
        <span class="port-led"></span>
        <span class="port-label">DISCORD</span>
        <span class="port-arrow">&#8594;</span>
      </a>
    </div>

    <footer>uplink stable · est. 2026</footer>
  </div>
</div>

</body>
</html>
